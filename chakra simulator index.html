      useEffect(() => {

        const scene = new THREE.Scene();

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        mountRef.current.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1, 100);

        scene.add(ground);

        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
        scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 })));

        const chakraObjects = [];
        const guideObjects = [];

        chakras.forEach((chakra, index) => {
          const isUnlocked = gameState.unlockedLevels.includes(index);
          if (isUnlocked) {
            const portalGroup = new THREE.Group();
            const ring = new THREE.Mesh(
              new THREE.TorusGeometry(2, 0.1, 16, 100),
              new THREE.MeshStandardMaterial({ color: chakra.color, emissive: chakra.color, emissiveIntensity: 0.8, metalness: 0.8, roughness: 0.2 })

            portalGroup.add(ring);

              new THREE.CircleGeometry(1.8, 32),
              new THREE.MeshBasicMaterial({ color: chakra.color, transparent: true, opacity: 0.3, side: THREE.DoubleSide })

            portal.rotation.y = Math.PI / 2;
            portalGroup.add(portal);
            const particles = new THREE.BufferGeometry();
            const particlePositions = [];
            for (let i = 0; i < 50; i++) {
              const angle = (i / 50) * Math.PI * 2;
              const radius = 2.5 + Math.random() * 0.5;
              particlePositions.push(Math.cos(angle) * radius, (Math.random() - 0.5) * 4, Math.sin(angle) * radius);
            }
            particles.setAttribute('position', new THREE.Float32BufferAttribute(particlePositions, 3));
            const particleSystem = new THREE.Points(particles, new THREE.PointsMaterial({ color: chakra.color, size: 0.15, transparent: true, opacity: 0.8 }));

            portalGroup.position.set(chakra.position.x, 3, chakra.position.z);
            portalGroup.userData = { type: 'portal', level: index, particles: particleSystem };
            scene.add(portalGroup);
            chakraObjects.push(portalGroup);

            const guideGroup = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: chakra.color, emissive: chakra.color, emissiveIntensity: 0.5, transparent: true, opacity: 0.8 });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.2, 16), bodyMat);
            body.position.y = 1;
            guideGroup.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), bodyMat);
            head.position.y = 1.85;
            guideGroup.add(head);
            const aura = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), new THREE.MeshBasicMaterial({ color: chakra.color, transparent: true, opacity: 0.2, side: THREE.BackSide }));
            aura.position.y = 1;
            guideGroup.add(aura);
            guideGroup.position.set(chakra.position.x, 0, chakra.position.z - 5);
            guideGroup.userData = { type: 'guide', level: index, aura };
            scene.add(guideGroup);
            guideObjects.push(guideGroup);
          } else {
            const orbGroup = new THREE.Group();
            const orb = new THREE.Mesh(
              new THREE.SphereGeometry(1.5, 32, 32),
              new THREE.MeshStandardMaterial({ color: chakra.color, emissive: chakra.color, emissiveIntensity: 0.3, transparent: true, opacity: 0.4, metalness: 0.8, roughness: 0.2 })
            );
            orbGroup.add(orb);
            const glow = new THREE.Mesh(new THREE.SphereGeometry(1.2, 32, 32), new THREE.MeshBasicMaterial({ color: chakra.color, transparent: true, opacity: 0.2, side: THREE.BackSide }));
            orbGroup.add(glow);
            orbGroup.position.set(chakra.position.x, 3, chakra.position.z);
            orbGroup.userData = { type: 'locked_orb', level: index, orb, glow };
            scene.add(orbGroup);
            chakraObjects.push(orbGroup);
          }
        });

        const keys = { w: false, a: false, s: false, d: false, arrowleft: false, arrowright: false };
        let rotationY = 0;
        const onKeyDown = (e) => { const k = e.key.toLowerCase(); if (keys.hasOwnProperty(k)) keys[k] = true; };
        const onKeyUp = (e) => {
          const k = e.key.toLowerCase();
          if (keys.hasOwnProperty(k)) keys[k] = false;
          if (k === 'e' && gameStateRef.current.nearGuide && !gameStateRef.current.isConversing && gameStateRef.current.guideLevel !== null) {
            setGameState(prev => ({ ...prev, isConversing: true }));
          }
        };
        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);

        let animationId;
        const clock = new THREE.Clock();
        const animate = () => {
          animationId = requestAnimationFrame(animate);
          const delta = clock.getDelta();
          const time = clock.getElapsedTime();
          if (keys.arrowleft) rotationY += 2 * delta;
          if (keys.arrowright) rotationY -= 2 * delta;
          const dir = new THREE.Vector3();
          if (keys.w) dir.z -= 1;
          if (keys.s) dir.z += 1;
          if (keys.a) dir.x -= 1;
          if (keys.d) dir.x += 1;
          if (dir.length() > 0) {
            dir.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), rotationY);
            camera.position.add(dir.multiplyScalar(5 * delta));
          }
          camera.rotation.y = rotationY;
          const dist = Math.sqrt(camera.position.x ** 2 + camera.position.z ** 2);
          if (dist > 25) {
            camera.position.x = (camera.position.x / dist) * 25;
            camera.position.z = (camera.position.z / dist) * 25;
          }
          chakraObjects.forEach((obj) => {
            if (obj.userData.type === 'portal') {
              obj.rotation.y += delta * 0.5;
              if (obj.userData.particles) obj.userData.particles.rotation.y += delta;
            } else if (obj.userData.type === 'locked_orb') {
              obj.rotation.y += delta * 0.3;
              obj.position.y = 3 + Math.sin(time * 2) * 0.3;
              if (obj.userData.orb) obj.userData.orb.material.emissiveIntensity = 0.3 + Math.sin(time * 3) * 0.2;
            }
          });
          guideObjects.forEach((g) => {
            g.rotation.y += delta * 0.5;
            if (g.userData.aura) g.userData.aura.scale.setScalar(1 + Math.sin(time * 2) * 0.1);
          });
          if (!gameStateRef.current.isConversing) {
            let nearAny = false, nearLvl = null;
            guideObjects.forEach((g) => {
              if (camera.position.distanceTo(g.position) < 3) { nearAny = true; nearLvl = g.userData.level; }
            });
            if (nearAny !== gameStateRef.current.nearGuide || nearLvl !== gameStateRef.current.guideLevel) {
              setGameState(prev => ({ ...prev, nearGuide: nearAny, guideLevel: nearLvl }));
              setUiMessage(nearAny && nearLvl !== null ? `Press E to speak with the ${chakras[nearLvl].title} Guide` : 'Explore the chakra realm. Walk to unlocked portals and their guides.');
            }
          }
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('keydown', onKeyDown);
          window.removeEventListener('keyup', onKeyUp);
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationId);
          if (mountRef.current && renderer.domElement) mountRef.current.removeChild(renderer.domElement);
        };
      }, [gameState.unlockedLevels]);

      const sendMessage = async () => {
        if (!message.trim() || gameState.loading || gameState.guideLevel === null) return;
        const userMsg = message;
        setMessage('');
        setGameState(prev => ({ ...prev, loading: true, conversationHistory: [...prev.conversationHistory, { role: 'user', content: userMsg }] }));
        try {
          const chakra = chakras[gameState.guideLevel];
          let sysPrompt = `You are the ${chakra.title} (${chakra.name}) guide. This chakra is about: ${chakra.description}. Number ${chakra.number}. Mantra: ${chakra.mantra}. Manifestation Affirmation: ${chakra.manifestationMantra}.`;
          if (gameState.guideLevel === 5) {
            sysPrompt += ` This is the Third Eye, seat of Lord Shiva (Tryambaka - the Three-Eyed One). You can teach about Shiva consciousness, Rudraksha beads (tears of Shiva), and the powerful MAHAMRITYUNJAYA MANTRA (Om Tryambakam Yajamahe...) - the Great Death-Conquering Mantra that opens the third eye and grants liberation from the cycle of death. This is the most sacred Shiva mantra for transcending illusion and awakening the third eye.`;
          }
          sysPrompt += ` Guide users through emotional intelligence, self-discovery, and manifestation practices. Reference the meditation practices and manifestation mantras when relevant. Be warm, wise, and supportive. Keep responses concise (2-3 paragraphs).`;
          let msgs = gameState.conversationHistory.length === 0
            ? [{ role: "user", content: `${sysPrompt}\n\nUser: ${userMsg}` }]
            : [...gameState.conversationHistory, { role: "user", content: userMsg }];
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 500, messages: msgs })
          });
          const data = await res.json();

                  <div style={{ display: 'flex', gap: '10px' }}>
                    {gameState.guideLevel < chakras.length - 1 && <button onClick={completeChakra} style={{ background: 'linear-gradient(135deg, #00ff88, #00ffff)', border: 'none', color: 'black', padding: '8px 15px', borderRadius: '5px', cursor: 'pointer', fontWeight: 'bold', fontSize: '12px' }}>Complete Chakra</button>}
                    {gameState.guideLevel === chakras.length - 1 && <button onClick={completeChakra} style={{ background: 'linear-gradient(135deg, #ff00ff, #ffff00)', border: 'none', color: 'black', padding: '8px 15px', borderRadius: '5px', cursor: 'pointer', fontWeight: 'bold', fontSize: '12px' }}>Complete Journey</button>}
                    <button onClick={() => setGameState(prev => ({ ...prev, isConversing: false }))} style={{ background: '#ff4444', border: 'none', color: 'white', padding: '8px 15px', borderRadius: '5px', cursor: 'pointer', fontSize: '12px' }}>Close</button>
                  </div>
                </div>
                <div style={{ flex: 1, overflowY: 'auto', marginBottom: '15px', padding: '10px', backgroundColor: 'rgba(255, 255, 255, 0.05)', borderRadius: '10px' }}>
                  {gameState.conversationHistory.map((msg, i) => (
                    <div key={i} style={{ marginBottom: '10px', padding: '10px', borderRadius: '8px', backgroundColor: msg.role === 'user' ? 'rgba(0, 100, 255, 0.2)' : 'rgba(0, 255, 200, 0.2)', textAlign: msg.role === 'user' ? 'right' : 'left' }}>
                      <strong>{msg.role === 'user' ? 'You' : 'Guide'}:</strong>
                      <p style={{ margin: '5px 0 0 0', fontSize: '14px' }}>{msg.content}</p>
                    </div>
                  ))}
                  {gameState.loading && <div style={{ textAlign: 'center', color: '#00ffff' }}>Guide is channeling wisdom...</div>}
                </div>
                <div style={{ display: 'flex', gap: '10px' }}>
                  <input type="text" value={message} onChange={(e) => setMessage(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && sendMessage()} placeholder="Share your thoughts..." disabled={gameState.loading} style={{ flex: 1, padding: '10px', borderRadius: '8px', border: '1px solid #00ffff', backgroundColor: 'rgba(0, 0, 0, 0.5)', color: 'white', fontSize: '14px' }} />
                  <button onClick={sendMessage} disabled={gameState.loading} style={{ padding: '10px 20px', borderRadius: '8px', border: 'none', backgroundColor: '#00ffff', color: 'black', fontWeight: 'bold', cursor: gameState.loading ? 'not-allowed' : 'pointer', opacity: gameState.loading ? 0.5 : 1 }}>Send</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.render(<ChakraMeditationGame />, document.getElementById('root'));
  </script>
</body>
</html>
