<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership House - Design Thinking Academy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;overflow:hidden;background:#000;color:#fff}
        #gameCanvas{width:100vw;height:100vh;display:block;cursor:crosshair}
        .screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .avatar-screen{background:linear-gradient(135deg,#000033,#001144,#000066)}
        .avatar-screen h1{font-family:'Orbitron',monospace;font-size:36px;background:linear-gradient(135deg,#00ffff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px}
        .avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
        .avatar-card{background:rgba(0,20,40,0.9);border:2px solid rgba(0,255,255,0.3);border-radius:15px;padding:15px;cursor:pointer;width:150px;text-align:center;transition:all 0.3s}
        .avatar-card:hover{transform:translateY(-5px);border-color:#00ffff}
        .avatar-card.selected{border-color:#ff00ff;box-shadow:0 10px 30px rgba(255,0,255,0.4)}
        .avatar-emoji{font-size:40px;margin-bottom:10px}
        .avatar-name{font-family:'Orbitron',monospace;color:#00ffff;font-size:12px}
        .start-btn{margin-top:30px;background:linear-gradient(135deg,#00ffff,#0088ff);border:none;border-radius:25px;padding:12px 40px;font-family:'Orbitron',monospace;font-weight:700;font-size:14px;color:#000;cursor:pointer;display:none}
        .start-btn.active{display:block}
        .loading-screen{background:radial-gradient(circle,#001144,#000);display:none}
        .loading-screen h1{font-family:'Orbitron',monospace;font-size:32px;background:linear-gradient(135deg,#00ffff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .load-bar{width:300px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin-top:20px;overflow:hidden}
        .load-fill{height:100%;width:0%;background:linear-gradient(90deg,#00ffff,#ff00ff);animation:load 2s forwards}
        @keyframes load{to{width:100%}}
        .player-hud{position:fixed;top:10px;left:10px;background:rgba(0,20,40,0.95);border:1px solid rgba(0,255,255,0.3);border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px;z-index:100}
        .player-emoji{font-size:28px}
        .player-name{font-family:'Orbitron',monospace;color:#00ffff;font-size:11px}
        .player-role{font-size:9px;color:#88ccff}
        .top-hud{position:fixed;top:10px;right:10px;display:flex;gap:10px;z-index:100}
        .stat-box{background:rgba(0,20,40,0.9);border:1px solid rgba(0,255,255,0.3);border-radius:8px;padding:8px 12px;font-size:10px}
        .xp-bar{width:120px;height:6px;background:rgba(0,0,0,0.5);border-radius:3px;overflow:hidden}
        .xp-fill{height:100%;background:linear-gradient(90deg,#00ff88,#00ffff);transition:width 0.3s}
        .module-panel{position:fixed;top:70px;right:10px;width:240px;background:rgba(0,20,40,0.95);border:1px solid rgba(0,255,255,0.3);border-radius:12px;max-height:70vh;overflow-y:auto;z-index:100}
        .panel-header{background:rgba(0,255,255,0.1);padding:10px;border-bottom:1px solid rgba(0,255,255,0.2);font-family:'Orbitron',monospace;font-size:11px;color:#00ffff}
        .module-list{padding:8px}
        .module-item{background:rgba(0,50,100,0.3);border:1px solid rgba(0,255,255,0.2);border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer;transition:all 0.3s}
        .module-item:hover{background:rgba(0,255,255,0.1);transform:translateX(5px)}
        .module-item.completed{border-color:#00ff88}
        .module-title{font-weight:600;font-size:12px;margin-bottom:4px}
        .module-progress{display:flex;align-items:center;gap:6px;font-size:9px;color:#88ccff}
        .progress-bar{flex:1;height:3px;background:rgba(0,0,0,0.5);border-radius:2px;overflow:hidden}
        .progress-fill{height:100%;background:#00ff88}
        .controls-hud{position:fixed;bottom:10px;left:10px;background:rgba(0,20,40,0.9);border:1px solid rgba(0,255,255,0.3);border-radius:10px;padding:10px;font-size:9px;z-index:100}
        .control-row{display:flex;align-items:center;gap:4px;margin-bottom:3px;color:#aaa}
        .key{background:rgba(0,255,255,0.2);border:1px solid rgba(0,255,255,0.4);border-radius:3px;padding:1px 4px;font-family:'Orbitron',monospace;font-size:7px;color:#00ffff}
        .tutorial-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,10,30,0.98);z-index:2000;display:none;overflow-y:auto}
        .tutorial-container{max-width:900px;margin:0 auto;padding:20px}
        .tutorial-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid rgba(0,255,255,0.3)}
        .tutorial-title{font-family:'Orbitron',monospace;font-size:22px;background:linear-gradient(135deg,#00ffff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .close-btn{background:rgba(255,50,50,0.2);border:1px solid rgba(255,50,50,0.5);border-radius:50%;width:36px;height:36px;color:#ff5555;cursor:pointer;font-size:16px;transition:all 0.3s}
        .close-btn:hover{background:rgba(255,50,50,0.4)}
        .breadcrumb{display:flex;gap:8px;margin-bottom:15px;font-size:11px;flex-wrap:wrap}
        .breadcrumb span{color:#00ffff;cursor:pointer}
        .breadcrumb span:hover{text-decoration:underline}
        .breadcrumb span.current{color:#ff00ff}
        .submodule-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
        .submodule-card{background:linear-gradient(135deg,rgba(0,50,100,0.4),rgba(0,30,60,0.6));border:1px solid rgba(0,255,255,0.3);border-radius:10px;padding:15px;cursor:pointer;transition:all 0.3s;position:relative}
        .submodule-card:hover{transform:translateY(-3px);border-color:#00ffff}
        .submodule-card.locked{opacity:0.5;cursor:not-allowed}
        .submodule-card.completed{border-color:#00ff88}
        .submodule-icon{font-size:28px;margin-bottom:8px}
        .submodule-title{font-family:'Orbitron',monospace;font-size:13px;color:#00ffff;margin-bottom:6px}
        .submodule-desc{font-size:11px;color:#aaa;line-height:1.4;margin-bottom:8px}
        .submodule-meta{display:flex;justify-content:space-between;font-size:9px;color:#88ccff}
        .status-badge{position:absolute;top:8px;right:8px;padding:2px 6px;border-radius:8px;font-size:8px;font-weight:700}
        .status-badge.new{background:#00ff88;color:#000}
        .status-badge.progress{background:#ffaa00;color:#000}
        .status-badge.done{background:#00ffff;color:#000}
        .lesson-content{background:rgba(0,30,60,0.5);border:1px solid rgba(0,255,255,0.2);border-radius:10px;padding:20px;margin-bottom:15px}
        .lesson-section{margin-bottom:20px}
        .lesson-section h3{font-family:'Orbitron',monospace;color:#00ffff;font-size:15px;margin-bottom:12px}
        .lesson-section p{line-height:1.7;color:#ddd;margin-bottom:12px;font-size:13px}
        .lesson-section ul{margin-left:18px;margin-bottom:12px}
        .lesson-section li{margin-bottom:6px;color:#ccc;font-size:12px}
        .info-box{background:rgba(0,255,255,0.1);border-left:3px solid #00ffff;padding:12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:12px}
        .tip-box{background:rgba(255,200,0,0.1);border-left:3px solid #ffaa00;padding:12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:12px}
        .practice-area{background:rgba(0,100,100,0.1);border:2px dashed rgba(0,255,255,0.3);border-radius:10px;padding:20px;margin:15px 0}
        .practice-title{font-family:'Orbitron',monospace;color:#00ff88;font-size:14px;margin-bottom:12px}
        .practice-input{width:100%;background:rgba(0,20,40,0.8);border:1px solid rgba(0,255,255,0.3);border-radius:8px;padding:10px;color:#fff;font-size:13px;min-height:80px;resize:vertical;font-family:inherit}
        .practice-input:focus{outline:none;border-color:#00ffff}
        .btn{border:none;border-radius:8px;padding:10px 20px;font-family:'Orbitron',monospace;font-weight:700;font-size:12px;cursor:pointer;transition:all 0.3s}
        .btn-primary{background:linear-gradient(135deg,#00ffff,#0088ff);color:#000}
        .btn-secondary{background:transparent;border:1px solid #ff00ff;color:#ff00ff}
        .btn-success{background:linear-gradient(135deg,#00ff88,#00cc66);color:#000}
        .btn:hover{transform:scale(1.05)}
        .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
        .btn-group{display:flex;gap:10px;justify-content:center;margin-top:15px;flex-wrap:wrap}
        .simulation-container{background:linear-gradient(135deg,rgba(100,0,100,0.2),rgba(0,50,100,0.2));border:2px solid rgba(255,0,255,0.4);border-radius:12px;padding:20px;margin:15px 0}
        .sim-header{text-align:center;margin-bottom:20px}
        .sim-title{font-family:'Orbitron',monospace;font-size:20px;background:linear-gradient(135deg,#ff00ff,#00ffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .sim-task{background:rgba(0,255,255,0.1);border-radius:8px;padding:12px;margin-bottom:12px}
        .quiz-container{background:rgba(255,0,255,0.05);border:1px solid rgba(255,0,255,0.3);border-radius:10px;padding:20px;margin:15px 0}
        .question-card{background:rgba(0,0,0,0.3);border-radius:8px;padding:15px;margin-bottom:12px}
        .question-text{font-size:14px;margin-bottom:12px;line-height:1.5}
        .option{background:rgba(0,50,100,0.3);border:1px solid rgba(0,255,255,0.2);border-radius:8px;padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;gap:8px;font-size:12px}
        .option:hover{background:rgba(0,255,255,0.1);border-color:#00ffff}
        .option.selected{background:rgba(0,255,255,0.2);border-color:#00ffff}
        .option.correct{background:rgba(0,255,136,0.2);border-color:#00ff88}
        .option.incorrect{background:rgba(255,50,50,0.2);border-color:#ff5555}
        .option-letter{background:rgba(0,255,255,0.2);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
        .results-card{background:linear-gradient(135deg,rgba(0,255,136,0.1),rgba(0,100,100,0.2));border:2px solid #00ff88;border-radius:12px;padding:25px;text-align:center;margin:15px 0}
        .results-score{font-family:'Orbitron',monospace;font-size:42px;color:#00ff88;margin:12px 0}
        .results-details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}
        .result-stat{background:rgba(0,0,0,0.3);border-radius:8px;padding:12px}
        .result-stat-value{font-family:'Orbitron',monospace;font-size:18px;color:#00ffff}
        .result-stat-label{font-size:10px;color:#88ccff;margin-top:4px}
        .achievement{position:fixed;top:70px;right:-300px;width:260px;background:linear-gradient(135deg,rgba(255,215,0,0.95),rgba(255,140,0,0.95));border-radius:10px;padding:12px;transition:right 0.5s;z-index:1500}
        .achievement.show{right:10px}
        .achievement-title{font-family:'Orbitron',monospace;font-weight:700;font-size:12px;color:#000}
        .achievement-desc{font-size:11px;color:rgba(0,0,0,0.8);margin-top:4px}
        #gameHUD{display:none}
        .interact-prompt{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(0,255,255,0.15);border:2px solid rgba(0,255,255,0.6);border-radius:25px;padding:10px 25px;font-family:'Orbitron',monospace;font-size:12px;color:#00ffff;display:none;z-index:100}
        .crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;color:rgba(0,255,255,0.7);pointer-events:none;display:none;z-index:100}
        .move-hint{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(0,20,40,0.95);border:2px solid rgba(0,255,255,0.4);border-radius:12px;padding:15px 25px;text-align:center;font-size:12px;color:#88ccff;z-index:100}
        .enable-mouse-btn{background:linear-gradient(135deg,#00ffff,#0088ff);border:none;border-radius:20px;padding:10px 20px;font-family:'Orbitron',monospace;font-weight:700;font-size:12px;color:#000;cursor:pointer}
        .scenario-container{background:linear-gradient(135deg,rgba(50,0,80,0.3),rgba(0,30,60,0.5));border:2px solid rgba(255,0,255,0.4);border-radius:12px;padding:20px;margin:15px 0}
        .scenario-header{display:flex;align-items:center;gap:12px;margin-bottom:15px;padding-bottom:12px;border-bottom:1px solid rgba(255,0,255,0.3)}
        .scenario-avatar{width:50px;height:50px;background:linear-gradient(135deg,#ff00ff,#8800ff);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
        .scenario-info h4{font-family:'Orbitron',monospace;color:#ff88ff;font-size:14px;margin-bottom:4px}
        .scenario-info p{font-size:11px;color:#aaa}
        .scenario-narrative{background:rgba(0,0,0,0.4);border-radius:10px;padding:15px;margin-bottom:15px;line-height:1.6;font-size:13px;color:#ddd;border-left:4px solid #ff00ff}
        .scenario-narrative .highlight{color:#00ffff;font-weight:600}
        .scenario-narrative .critical{color:#ff8888;font-weight:600}
        .scenario-context{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:15px}
        .context-card{background:rgba(0,50,100,0.3);border-radius:6px;padding:10px;text-align:center}
        .context-icon{font-size:20px;margin-bottom:4px}
        .context-label{font-size:9px;color:#88ccff;margin-bottom:2px}
        .context-value{font-family:'Orbitron',monospace;font-size:12px;color:#00ffff}
        .decision-prompt{background:rgba(255,200,0,0.1);border:1px solid rgba(255,200,0,0.4);border-radius:8px;padding:12px;margin-bottom:15px}
        .decision-prompt h5{color:#ffcc00;font-size:12px;margin-bottom:6px}
        .decision-prompt p{font-size:12px;color:#ddd}
        .scenario-choices{display:flex;flex-direction:column;gap:10px}
        .scenario-choice{background:linear-gradient(135deg,rgba(0,50,100,0.5),rgba(0,30,60,0.7));border:2px solid rgba(0,255,255,0.3);border-radius:10px;padding:12px 15px;cursor:pointer;transition:all 0.3s;position:relative}
        .scenario-choice:hover{border-color:#00ffff;transform:translateX(8px)}
        .scenario-choice.selected{border-color:#ff00ff;background:linear-gradient(135deg,rgba(100,0,100,0.4),rgba(50,0,80,0.5))}
        .choice-letter{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;background:rgba(0,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-weight:700;font-size:12px;color:#00ffff}
        .choice-content{margin-left:40px}
        .choice-title{font-weight:600;color:#fff;margin-bottom:4px;font-size:13px}
        .choice-desc{font-size:11px;color:#aaa}
        .choice-impact{display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.1);font-size:10px}
        .scenario-choice.selected .choice-impact{display:block}
        .impact-positive{color:#00ff88}
        .impact-negative{color:#ff8888}
        .scenario-result{background:linear-gradient(135deg,rgba(0,100,80,0.3),rgba(0,50,50,0.5));border:2px solid #00ff88;border-radius:12px;padding:20px;margin-top:15px;text-align:center}
        .scenario-result.poor{background:linear-gradient(135deg,rgba(100,50,0,0.3),rgba(80,30,0,0.5));border-color:#ff8844}
        .scenario-result.fail{background:linear-gradient(135deg,rgba(100,0,0,0.3),rgba(80,0,0,0.5));border-color:#ff4444}
        .result-icon{font-size:40px;margin-bottom:12px}
        .result-title{font-family:'Orbitron',monospace;font-size:18px;color:#00ff88;margin-bottom:8px}
        .scenario-result.poor .result-title{color:#ff8844}
        .scenario-result.fail .result-title{color:#ff4444}
        .result-feedback{font-size:12px;color:#ddd;line-height:1.5;margin-bottom:15px;text-align:left}
        .result-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}
        .metric{background:rgba(0,0,0,0.3);border-radius:6px;padding:10px}
        .metric-value{font-family:'Orbitron',monospace;font-size:16px;color:#00ffff}
        .metric-label{font-size:9px;color:#88ccff;margin-top:3px}
        .metric-change{font-size:10px;margin-top:2px}
        .metric-change.up{color:#00ff88}
        .metric-change.down{color:#ff8888}
        .timeline-bar{display:flex;align-items:center;justify-content:center;gap:4px;margin:15px 0}
        .timeline-node{width:28px;height:28px;border-radius:50%;background:rgba(0,50,100,0.5);border:2px solid rgba(0,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:11px}
        .timeline-node.active{background:rgba(0,255,255,0.3);border-color:#00ffff}
        .timeline-node.completed{background:#00ff88;border-color:#00ff88;color:#000}
        .timeline-connector{width:25px;height:2px;background:rgba(0,255,255,0.3)}
        .timeline-connector.completed{background:#00ff88}
        @media(max-width:768px){.avatar-grid{grid-template-columns:repeat(2,1fr)}.submodule-grid{grid-template-columns:1fr}.scenario-context,.result-metrics{grid-template-columns:repeat(2,1fr)}.results-details{grid-template-columns:1fr}.module-panel{display:none}}
    </style>
</head>
<body>
    <div class="screen avatar-screen" id="avatarScreen">
        <h1>🚀 Leadership House</h1>
        <div class="avatar-grid">
            <div class="avatar-card" data-avatar='{"name":"Ethan","title":"Innovation Lead","emoji":"👨‍💼"}'><div class="avatar-emoji">👨‍💼</div><div class="avatar-name">Ethan</div></div>
            <div class="avatar-card" data-avatar='{"name":"Sophia","title":"UX Director","emoji":"👩‍💼"}'><div class="avatar-emoji">👩‍💼</div><div class="avatar-name">Sophia</div></div>
            <div class="avatar-card" data-avatar='{"name":"Lucas","title":"Tech Lead","emoji":"👨‍💻"}'><div class="avatar-emoji">👨‍💻</div><div class="avatar-name">Lucas</div></div>
            <div class="avatar-card" data-avatar='{"name":"Emma","title":"Product Lead","emoji":"👩‍🏫"}'><div class="avatar-emoji">👩‍🏫</div><div class="avatar-name">Emma</div></div>
        </div>
        <button class="start-btn" id="startBtn" onclick="startGame()">Enter Academy</button>
    </div>
    <div class="screen loading-screen" id="loadingScreen">
        <h1>LEADERSHIP HOUSE</h1>
        <p style="color:#88ccff;margin-top:10px;">Design Thinking Academy</p>
        <div class="load-bar"><div class="load-fill"></div></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="gameHUD">
        <div class="player-hud"><div class="player-emoji" id="playerEmoji">👨‍💼</div><div><div class="player-name" id="playerName">Player</div><div class="player-role" id="playerRole">Role</div></div></div>
        <div class="top-hud">
            <div class="stat-box"><span style="color:#00ff88;">Lv:</span> <span id="levelDisplay">1</span></div>
            <div class="stat-box"><div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div><div style="text-align:center;margin-top:2px;font-size:8px;"><span id="xpDisplay">0</span>/1000</div></div>
        </div>
        <div class="module-panel"><div class="panel-header">📚 MODULES</div><div class="module-list" id="moduleList"></div></div>
        <div class="controls-hud">
            <div style="font-family:'Orbitron',monospace;color:#00ffff;font-size:9px;margin-bottom:6px;">CONTROLS</div>
            <div class="control-row"><span class="key">WASD</span> Move</div>
            <div class="control-row"><span class="key">SPACE</span> Jump</div>
            <div class="control-row"><span class="key">E</span> Interact</div>
        </div>
        <div class="achievement" id="achievement"><div class="achievement-title" id="achieveTitle">🏆 Achievement!</div><div class="achievement-desc" id="achieveDesc">Welcome!</div></div>
        <div class="interact-prompt" id="interactPrompt">Press E to Access</div>
        <div class="crosshair" id="crosshair">+</div>
        <div class="move-hint" id="moveHint"><button class="enable-mouse-btn" id="enableMouseBtn">🖱️ Click to Enable Mouse Look</button><div style="margin-top:8px;font-size:10px;">Use WASD to move</div></div>
    </div>
    <div class="tutorial-overlay" id="tutorialOverlay"><div class="tutorial-container" id="tutorialContainer"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const branchingScenarios={empathy:[{id:"emp1",title:"The Healthcare Crisis",character:"👩‍⚕️",role:"UX Research Lead",situation:`Your company is developing a <span class="highlight">patient portal</span> for 2 million patients. Executives want to <span class="critical">skip user research</span> to meet the deadline. Your team fears the design may confuse elderly patients.`,context:{teamMorale:65,patientSafety:70,stakeholderTrust:50,timeline:40},decisions:[{id:"A",title:"Rapid Guerrilla Research",desc:"Propose a 3-day intensive research sprint with 10 patients on critical flows.",impacts:{teamMorale:15,patientSafety:20,stakeholderTrust:10,timeline:-5},outcome:"positive",feedback:"Excellent! The guerrilla research revealed 3 critical usability issues. The CMO praised your pragmatic approach."},{id:"B",title:"Escalate to Board",desc:"Present patient safety risks directly to the Board of Directors.",impacts:{teamMorale:5,patientSafety:10,stakeholderTrust:-25,timeline:-15},outcome:"poor",feedback:"Escalating without attempting compromise damaged your relationship with leadership."},{id:"C",title:"Comply with Timeline",desc:"Skip research and rely on existing assumptions to meet the deadline.",impacts:{teamMorale:-20,patientSafety:-30,stakeholderTrust:15,timeline:20},outcome:"fail",feedback:"15% of patients made medication errors. A lawsuit is pending. Always advocate for user safety."},{id:"D",title:"Use Existing Data",desc:"Analyze call center logs and support tickets instead of new research.",impacts:{teamMorale:10,patientSafety:5,stakeholderTrust:15,timeline:10},outcome:"poor",feedback:"Secondary data missed the emotional experience. User satisfaction is below target."}]},{id:"emp2",title:"Global Expansion",character:"🌏",role:"Head of Research",situation:`Your fintech app is expanding to <span class="highlight">Southeast Asia</span> in 8 weeks. Leadership wants to replicate the US design. Your <span class="critical">budget was cut 60%</span>.`,context:{culturalFit:45,marketSuccess:50,budget:30,localTrust:40},decisions:[{id:"A",title:"Remote Cultural Immersion",desc:"Video interviews with 15 users across 3 markets plus local UX consultants.",impacts:{culturalFit:25,marketSuccess:20,budget:-10,localTrust:20},outcome:"positive",feedback:"Remote research revealed critical cultural needs. Your adaptations drove 3x higher adoption."},{id:"B",title:"Launch and Learn",desc:"Launch translated version and iterate based on market feedback.",impacts:{culturalFit:-15,marketSuccess:-20,budget:20,localTrust:-25},outcome:"fail",feedback:"The launch was a disaster. App store ratings dropped to 2.1 stars."},{id:"C",title:"Focus One Market",desc:"Launch in Thailand first with proper research, then expand.",impacts:{culturalFit:15,marketSuccess:10,budget:5,localTrust:10},outcome:"poor",feedback:"Cautious approach reduced risk but competitors captured other markets."},{id:"D",title:"AI Analysis",desc:"Use AI tools to analyze social media for cultural insights.",impacts:{culturalFit:5,marketSuccess:5,budget:15,localTrust:-5},outcome:"poor",feedback:"AI provided surface-level insights but missed nuanced cultural behaviors."}]}],define:[{id:"def1",title:"Conflicting Stakeholders",character:"🎯",role:"Design Strategy Director",situation:`Three stakeholders have <span class="critical">different interpretations</span> of your research:<br>• CMO: "inspiration"<br>• COO: "efficiency"<br>• CTO: "AI personalization"`,context:{clarity:50,alignment:35,momentum:60,politicalCapital:55},decisions:[{id:"A",title:"Journey Framework",desc:"Present a journey-based POV that encompasses all perspectives at different stages.",impacts:{clarity:20,alignment:25,momentum:10,politicalCapital:15},outcome:"positive",feedback:"Masterful reframing! You created a unified vision with full executive backing."},{id:"B",title:"Present Raw Data",desc:"Show synthesis without interpretation, let stakeholders debate.",impacts:{clarity:-10,alignment:-15,momentum:-20,politicalCapital:5},outcome:"fail",feedback:"The meeting devolved into a 3-hour argument. Project is stalled."},{id:"C",title:"Ally with CMO",desc:"Frame POV around inspiration to secure CMO's championship.",impacts:{clarity:10,alignment:-10,momentum:15,politicalCapital:-15},outcome:"poor",feedback:"CMO funded project, but COO and CTO are now blocking."},{id:"D",title:"Competing POVs",desc:"Present three POV statements and let leadership vote.",impacts:{clarity:-5,alignment:5,momentum:-10,politicalCapital:10},outcome:"poor",feedback:"This signaled you couldn't synthesize into a clear direction."}]},{id:"def2",title:"The Pivot Pressure",character:"📊",role:"Product Design Lead",situation:`Your validated research shows users want <span class="highlight">AI-assisted decisions</span>. The board wants to pivot to <span class="critical">autonomous AI agents</span> after a conference.`,context:{productVision:70,boardConf:45,teamFocus:65,userAlignment:80},decisions:[{id:"A",title:"Present Evidence",desc:"Show user quotes and data proving users want AI-assisted, not autonomous.",impacts:{productVision:10,boardConf:20,teamFocus:15,userAlignment:10},outcome:"positive",feedback:"Video clips of users convinced the board. Your POV held."},{id:"B",title:"Propose Hybrid",desc:"Include AI agents as optional 'auto-pilot mode'.",impacts:{productVision:-5,boardConf:15,teamFocus:-10,userAlignment:-5},outcome:"poor",feedback:"Compromise diluted vision. Engineering builds two modes, timeline slipped."},{id:"C",title:"Embrace Pivot",desc:"Accept board's direction and redefine the problem.",impacts:{productVision:-20,boardConf:25,teamFocus:-15,userAlignment:-30},outcome:"fail",feedback:"Beta users rejected autonomous AI. Your original POV was right."},{id:"D",title:"Request Time",desc:"Ask for 2 weeks to run concept tests.",impacts:{productVision:5,boardConf:-10,teamFocus:5,userAlignment:15},outcome:"poor",feedback:"Board saw this as indecision. Sometimes defend with existing evidence."}]}],ideate:[{id:"idea1",title:"Innovation Drought",character:"💡",role:"Innovation Director",situation:`Day 1 of ideation is a disaster: <span class="critical">compliance shoots down every idea</span>, IT says everything is "impossible," marketing only wants existing campaigns.`,context:{ideaCount:25,novelty:30,teamEnergy:40,feasibility:70},decisions:[{id:"A",title:"'Yes, And' Rules",desc:"Establish strict brainstorming rules: no criticism, defer judgment, use 'parking lot'.",impacts:{ideaCount:35,novelty:25,teamEnergy:30,feasibility:-10},outcome:"positive",feedback:"Transformative! Team generated 87 ideas, 12 moved to prototyping."},{id:"B",title:"Split Groups",desc:"Separate dreamers from realists into parallel tracks.",impacts:{ideaCount:20,novelty:15,teamEnergy:10,feasibility:15},outcome:"poor",feedback:"Split created 'us vs them' dynamic. Tracks never merged effectively."},{id:"C",title:"Focus Constraints",desc:"Challenge: 'How might we innovate WITHIN compliance rules?'",impacts:{ideaCount:15,novelty:10,teamEnergy:15,feasibility:25},outcome:"poor",feedback:"Constraints too early limited ambition. All ideas were incremental."},{id:"D",title:"Outside Inspiration",desc:"Show Netflix, Amazon, Spotify cases. Ask: 'What would they do as a bank?'",impacts:{ideaCount:25,novelty:30,teamEnergy:20,feasibility:-5},outcome:"positive",feedback:"External inspiration broke mental models! 'What would Spotify do?' led to 'financial playlists'."}]},{id:"idea2",title:"Acquisition Aftermath",character:"🔥",role:"Chief Design Officer",situation:`Two weeks post-acquisition, <span class="critical">tensions explode</span> between "move fast" acquiring team and "research-driven" acquired team. Two designers threatening to quit.`,context:{teamUnity:25,ideaDiversity:40,culturalIntegration:30,innovation:50},decisions:[{id:"A",title:"Hybrid Method",desc:"Use Crazy 8s for volume, research-backed evaluation for quality. Honor both.",impacts:{teamUnity:30,ideaDiversity:25,culturalIntegration:25,innovation:20},outcome:"positive",feedback:"Brilliant cultural bridge! Both teams felt respected, output exceeded either alone."},{id:"B",title:"Mandate One Method",desc:"Declare all ideation follows standardized process for consistency.",impacts:{teamUnity:-20,ideaDiversity:-15,culturalIntegration:-25,innovation:-10},outcome:"fail",feedback:"Disaster. Half the team felt their culture erased. Three designers resigned."},{id:"C",title:"Team Building First",desc:"Pause for 2-day workshop on understanding each team's values.",impacts:{teamUnity:20,ideaDiversity:10,culturalIntegration:20,innovation:-10},outcome:"poor",feedback:"Bonding improved but CEO frustrated by delay. Could build trust through work."},{id:"D",title:"Competition",desc:"Have both teams compete in parallel sprints for judging.",impacts:{teamUnity:-15,ideaDiversity:15,culturalIntegration:-20,innovation:15},outcome:"fail",feedback:"Competition destroyed collaboration. Losing team felt humiliated."}]}],prototype:[{id:"proto1",title:"Investor Demo",character:"🔧",role:"Head of Product",situation:`Series B depends on demo in <span class="highlight">5 days</span>. Your AI feature produces <span class="critical">errors 40% of the time</span>. Engineers need 3 more weeks.`,context:{investorConf:60,credibility:75,fundingProb:50,teamIntegrity:80},decisions:[{id:"A",title:"Wizard of Oz",desc:"Hidden team member controls AI responses. Disclose it's a 'concept prototype'.",impacts:{investorConf:20,credibility:10,fundingProb:25,teamIntegrity:5},outcome:"positive",feedback:"Smart strategy! You disclosed it was a concept. Series B closed at $18M."},{id:"B",title:"Scripted Fake",desc:"Pre-record AI responses, play back as if live without disclosure.",impacts:{investorConf:15,credibility:-40,fundingProb:-30,teamIntegrity:-35},outcome:"fail",feedback:"Off-script question exposed the facade. Word spread you're 'deceptive'."},{id:"C",title:"Honest Delay",desc:"Request 3-week delay for working prototype.",impacts:{investorConf:-15,credibility:15,fundingProb:-20,teamIntegrity:20},outcome:"poor",feedback:"Respected honesty but concerned about execution. Lower valuation, restrictive terms."},{id:"D",title:"Pivot Narrative",desc:"Reframe around working parts, position AI as 'phase 2'.",impacts:{investorConf:5,credibility:10,fundingProb:10,teamIntegrity:15},outcome:"poor",feedback:"Investors noticed missing AI. Smaller investment than hoped."}]},{id:"proto2",title:"Factory Floor",character:"🏭",role:"Industrial Design Lead",situation:`Digital prototypes tested well in lab. Field test revealed problems: <span class="critical">workers wear heavy gloves, factory is noisy</span>. VP wants to skip more prototyping.`,context:{workerAdoption:35,functionality:55,timeline:50,safety:70},decisions:[{id:"A",title:"Bodystorming Sprint",desc:"3 days on factory floor prototyping with actual gloves, lighting, co-designing with workers.",impacts:{workerAdoption:30,functionality:25,timeline:-10,safety:15},outcome:"positive",feedback:"Transformative! Touch targets 3x larger, workers became advocates. 94% adoption."},{id:"B",title:"Technical Fixes Only",desc:"Larger buttons, brighter screens. Skip worker involvement.",impacts:{workerAdoption:-10,functionality:15,timeline:15,safety:5},outcome:"poor",feedback:"Workers still resisted. Felt changes 'done to them'. 60% adoption."},{id:"C",title:"Proceed Rollout",desc:"Trust VP, begin full rollout, iterate on real feedback.",impacts:{workerAdoption:-25,functionality:-20,timeline:20,safety:-25},outcome:"fail",feedback:"30% productivity drop, 2 safety incidents. Union demanded removal."},{id:"D",title:"Parallel Pilot",desc:"50 volunteers help refine design while rest uses existing system.",impacts:{workerAdoption:15,functionality:15,timeline:-15,safety:10},outcome:"positive",feedback:"Volunteers became champions. 89% adoption in 6 weeks."}]}],test:[{id:"test1",title:"Conflicting Results",character:"🧪",role:"VP of UX",situation:`Usability testing: <span class="highlight">4.5/5 satisfaction</span>. A/B testing: <span class="critical">15% lower conversion</span>. CEO wants answers before board meeting.`,context:{decisionClarity:30,stakeholderConf:40,designCredibility:50,businessImpact:45},decisions:[{id:"A",title:"Deep Dive Analysis",desc:"Segment A/B data by user type. Hypothesize satisfaction differs by segment.",impacts:{decisionClarity:30,stakeholderConf:15,designCredibility:20,businessImpact:20},outcome:"positive",feedback:"Returning customers: +22%, new customers: -35%. Solution: personalize by user type."},{id:"B",title:"Trust Quantitative",desc:"Recommend reverting. Conversion is the metric that matters.",impacts:{decisionClarity:15,stakeholderConf:10,designCredibility:-25,businessImpact:10},outcome:"poor",feedback:"Revert protected short-term but demoralized design team."},{id:"C",title:"Trust Qualitative",desc:"Argue A/B must have a bug. Push forward with launch.",impacts:{decisionClarity:-10,stakeholderConf:-15,designCredibility:-20,businessImpact:-25},outcome:"fail",feedback:"15% drop held. Board lost confidence in UX judgment."},{id:"D",title:"More Testing",desc:"Pause launch for additional usability tests on conversion.",impacts:{decisionClarity:10,stakeholderConf:-20,designCredibility:5,businessImpact:-10},outcome:"poor",feedback:"Delay frustrated stakeholders. 'Analysis paralysis' comments."}]},{id:"test2",title:"Launch Crisis",character:"🚀",role:"Product Design Director",situation:`Launched 48 hours ago. <span class="critical">3 clients threatening to cancel</span>, 2.1 star rating, social media complaints about 'confusing navigation'.`,context:{customerRet:35,teamHealth:25,brandRep:30,recovery:40},decisions:[{id:"A",title:"Rapid Triage",desc:"10 emergency user tests TODAY. Top 3 fixes in 72 hours. Communicate plan to clients.",impacts:{customerRet:25,teamHealth:-10,brandRep:20,recovery:30},outcome:"positive",feedback:"72-hour fix resolved 80% of complaints. Two clients praised responsiveness."},{id:"B",title:"Full Rollback",desc:"Immediately revert to previous version.",impacts:{customerRet:10,teamHealth:15,brandRep:-10,recovery:5},outcome:"poor",feedback:"Stopped bleeding but some users frustrated by switch back. 'Failed launch' press."},{id:"C",title:"Wait and Monitor",desc:"Users often complain about changes. Wait one week for adaptation.",impacts:{customerRet:-20,teamHealth:10,brandRep:-25,recovery:-15},outcome:"fail",feedback:"Negative reviews compounded. 2 clients actually canceled. 'Not listening' perception."},{id:"D",title:"Investigate Process",desc:"Retrospective on why pre-launch testing missed issues before action.",impacts:{customerRet:-10,teamHealth:5,brandRep:-15,recovery:0},outcome:"poor",feedback:"Retrospective during crisis sent wrong message. Clients wanted action."}]}]};

const courseData={empathy:{title:"Empathy",icon:"❤️",color:"#00ff88",description:"Understand users deeply",submodules:[{id:"emp_observe",title:"Observation",icon:"👁️",duration:"20m",xp:150,content:{intro:"Learn to see what users do, not just what they say.",sections:[{title:"User Observation",text:"Watch people in their natural context to reveal unconscious behaviors.",tips:["Observe without interfering","Note body language","Look for workarounds"]},{title:"AEIOU Framework",list:["Activities: What doing?","Environments: Where?","Interactions: How?","Objects: What using?","Users: Who?"]}],practice:{title:"Practice",prompt:"Using AEIOU, describe observing a coffee shop customer for 15 minutes.",hints:["Morning vs afternoon","Solo vs groups","Payment process"]},quiz:[{q:"Main advantage of observation over interviews?",options:["Faster","Reveals unconscious behaviors","Cheaper","Users prefer it"],correct:1},{q:"'I' in AEIOU?",options:["Ideas","Interactions","Insights","Intentions"],correct:1},{q:"Which involves following users?",options:["Fly on wall","Contextual inquiry","Shadowing","Photo study"],correct:2},{q:"Avoid in 'fly on wall'?",options:["Notes","Video","Interfering","Context"],correct:2}]}},{id:"emp_interview",title:"Interviews",icon:"🎤",duration:"25m",xp:175,content:{intro:"Learn techniques to ask the right questions.",sections:[{title:"Question Types",list:["Open-ended: 'Tell me about...'","Probing: 'Why do you think?'","Hypothetical: 'What if...'","Closed: 'Do you...' (sparingly)"]},{title:"5 Whys",text:"Keep asking 'why' to reach root causes."}],practice:{title:"Script",prompt:"Write 5 open-ended questions for a fitness app study.",hints:["Current routine","Past app experiences","Goals and barriers"]},quiz:[{q:"Use most frequently?",options:["Closed","Leading","Open-ended","Yes/no"],correct:2},{q:"5 Whys purpose?",options:["Annoy users","Root causes","Fill time","Test patience"],correct:1},{q:"With silence?",options:["Fill immediately","End interview","Let ent"],correct:1}]}}],simulation:{title:"Empathy Simulation",scenario:"Design medication reminder for elderly. 3 days before sprint.",tasks:[{title:"Research Plan",desc:"What methods? Where find participants?",points:25},{title:"Interview Guide",desc:"10 questions about medication routines.",points:25},{title:"Empathy Map",desc:"For 'Margaret, 72, living alone'.",points:25},{title:"Journey Map",desc:"Margaret's medication journey.",points:25}],passingScore:70}},define:{title:"Define",icon:"🎯",color:"#0088ff",description:"Transform insights into problem statements",submodules:[{id:"def_synthesis",title:"Synthesis",icon:"🔄",duration:"25m",xp:175,content:{intro:"Transform research into patterns and insights.",sections:[{title:"Affinity Diagramming",list:["Write observations on notes","Group related notes","Name themes","Find patterns","Identify insights"]}],practice:{title:"Practice",prompt:"Food delivery observations: 'check reviews', 'photos help', 'want spiciness info'. What themes?",hints:["Look for frustrations","Underlying need","Uncertainty"]},quiz:[{q:"Observation vs insight?",options:["Same","Insights reveal non-obvious truths","Observations more valuable","Insights first"],correct:1},{q:"First affinity step?",options:["Name groups","Find patterns","Write observations","Present"],correct:2},{q:"Good insight is?",options:["Vague","Obvious","Specific and actionable","Assumption-based"],correct:2},{q:"Synthesis finds?",options:["Random ideas","Patterns and themes","Bugs","Slogans"],correct:1}]}},{id:"def_pov",title:"POV Statements",icon:"📝",duration:"20m",xp:150,content:{intro:"Frame problems from user perspective.",sections:[{title:"POV Formula",text:"[USER] needs [NEED] because [INSIGHT]"},{title:"Strong POV",list:["USER: Specific, not generic","NEED: A verb, not solution","INSIGHT: Surprising 'why'"]}],practice:{title:"Write POV",prompt:"'Remote workers struggle with boundaries because home and office merged.' Write POV.",hints:["Specific user","Emotional need","Human insight"]},quiz:[{q:"POV formula?",options:["Problem+Solution","User+Need+Insight","Who+What+When","Feature+Benefit"],correct:1},{q:"NEED should be?",options:["Solution","Feature","Verb/action","Goal"],correct:2},{q:"Effective POV is?",options:["Prescribes solution","Vague","Based on insights","Tech-focused"],correct:2},{q:"Better user description?",options:["People","Users","Busy single parents","Everyone"],correct:2}]}},{id:"def_hmw",title:"HMW Questions",icon:"❓",duration:"20m",xp:150,content:{intro:"Transform problems into opportunities.",sections:[{title:"HMW Power",text:"'How' = solutions exist. 'Might' = exploration. 'We' = collaboration."},{title:"Variations",list:["Remove bad","Amplify good","Explore opposite","Question assumption"]}],practice:{title:"Generate HMW",prompt:"'Gym members feel intimidated, quit in 3 months.' Write 5 HMW questions.",hints:["Emotional aspect","Social dynamics","Question assumptions"]},quiz:[{q:"'Might' suggests?",options:["Certainty","Obligation","Exploration","Doubt"],correct:2},{q:"Good HMW is?",options:["Very broad","Solution-focused","Actionable but open","Very specific"],correct:2},{q:"Problem with 'HMW create app'?",options:["Too short","Embeds solution","Wrong grammar","Nothing"],correct:1},{q:"HMW comes from?",options:["Brainstorming","POV insights","Competitors","Executives"],correct:1}]}},{id:"def_criteria",title:"Success Criteria",icon:"✅",duration:"25m",xp:175,content:{intro:"Define success before designing.",sections:[{title:"SMART",list:["Specific","Measurable","Achievable","Relevant","Time-bound"]}],practice:{title:"Define Success",prompt:"For onboarding app, define 3 SMART criteria.",hints:["Time-to-productivity","Satisfaction","Measurable outcomes"]},quiz:[{q:"Why define early?",options:["Formality","Align and guide","Impress","Not important"],correct:1},{q:"'M' in SMART?",options:["Meaningful","Measurable","Motivating","Minimal"],correct:1},{q:"User metric?",options:["Revenue","Task completion","Stock price","Team size"],correct:1},{q:"Good criteria?",options:["Vague","Specific and measurable","Unrealistic","Unmeasurable"],correct:1}]}}],simulation:{title:"Define Simulation",scenario:"Library redesign. 20 patron interviews, 10 librarian interviews.",tasks:[{title:"Affinity Map",desc:"4-5 major themes.",points:25},{title:"Insights",desc:"3 non-obvious insights.",points:25},{title:"POV",desc:"For 'Elena, 35, working mother'.",points:25},{title:"HMW",desc:"5 HMW questions.",points:25}],passingScore:70}},ideate:{title:"Ideation",icon:"💡",color:"#ffff00",description:"Generate creative solutions",submodules:[{id:"idea_brainstorm",title:"Brainstorming",icon:"🧠",duration:"25m",xp:175,content:{intro:"Master brainstorming techniques.",sections:[{title:"Rules",list:["Defer judgment","Wild ideas","Build on others","Stay focused","Go for quantity"]}],practice:{title:"Exercise",prompt:"'HMW make public transport enjoyable?' 10 ideas in 5 minutes.",hints:["All senses","Tech and no-tech","Make it fun"]},quiz:[{q:"#1 rule?",options:["Be realistic","Defer judgment","One idea each","Work alone"],correct:1},{q:"'Yes, and' means?",options:["Agree always","Build on ideas","Say yes always","Be positive"],correct:1},{q:"6-3-5?",options:["Brain story","6 people, 3 ideas, 5 min","635 ideas","App"],correct:1},{q:"Why quantity?",options:["Efficient","More=better","Impress","Quality doesn't matter"],correct:1}]}},{id:"idea_scamper",title:"SCAMPER",icon:"🔧",duration:"25m",xp:175,content:{intro:"Systematic idea generation.",sections:[{title:"Framework",list:["Substitute","Combine","Adapt","Modify","Put to other uses","Eliminate","Reverse"]}],practice:{title:"Exercise",prompt:"Apply SCAMPER to coffee shop. One idea per letter.",hints:["S: Replace baristas?","C: Combine with?","E: Eliminate what?"]},quiz:[{q:"'S' in SCAMPER?",options:["Simplify","Substitute","Strategize","Systemize"],correct:1},{q:"'Combine' prompts?",options:["Reduce","Merge elements","Copy","Add steps"],correct:1},{q:"'What removed?'",options:["Substitute","Adapt","Eliminate","Reverse"],correct:2},{q:"SCAMPER best on?",options:["New concepts","Existing products","Physical only","Services only"],correct:1}]}},{id:"idea_crazy8",title:"Crazy 8s",icon:"⚡",duration:"20m",xp:150,content:{intro:"Time-boxed rapid sketching.",sections:[{title:"Method",text:"8 sections, 8 ideas, 8 minutes. 1 minute each. Speed prevents overthinking."}],practice:{title:"Challenge",prompt:"Sketch 8 app home screens for 'daily motivation'. 8 minutes.",hints:["1 min per sketch","Vary layouts","Don't judge"]},quiz:[{q:"Time per idea?",options:["8 min","8 sec","1 min","As needed"],correct:2},{q:"Why speed?",options:["Finish faster","Prevent overthinking","Compete","Save paper"],correct:1},{q:"Sketch quality?",options:["Professional","Detailed","Rough OK","No sketching"],correct:2},{q:"Don't like sketch?",options:["Erase","Keep moving","Stop","Ask help"],correct:1}]}},{id:"idea_converge",title:"Selection",icon:"🎯",duration:"25m",xp:175,content:{intro:"Evaluate and select best ideas.",sections:[{title:"Impact/Effort Matrix",text:"High Impact/Low Effort = Quick Wins. Prioritize these."}],practice:{title:"Prioritize",prompt:"6 remote work ideas. Use Impact/Effort matrix.",hints:["Consider complexity","Think adoption","Weigh impact"]},quiz:[{q:"Convergence is?",options:["Generating","Narrowing","Expanding","Launching"],correct:1},{q:"Prioritize quadrant?",options:["High effort/low impact","Low/low","High impact/low effort","Avoid all"],correct:2},{q:"Dot voting?",options:["Polka-dot","Limited votes on favorites","Digital poll","Drawing dots"],correct:1},{q:"In Now/Wow/How, pursue?",options:["NOW","WOW","HOW","None"],correct:1}]}}],simulation:{title:"Ideation Simulation",scenario:"Hospital check-in redesign.",tasks:[{title:"Brainstorm",desc:"15 ideas for reducing wait anxiety.",points:25},{title:"SCAMPER",desc:"Apply to current kiosk.",points:25},{title:"Crazy 8s",desc:"8 patient journey displays.",points:25},{title:"Prioritize",desc:"Impact/Effort for top 10.",points:25}],passingScore:70}},prototype:{title:"Prototype",icon:"🔧",color:"#ff8800",description:"Build quick experiments",submodules:[{id:"proto_principles",title:"Principles",icon:"📐",duration:"20m",xp:150,content:{intro:"Why and how we prototype.",sections:[{title:"Why?",text:"Think through ideas, communicate, test cheaply, fail fast."},{title:"Fidelity",list:["Low: Paper (hours)","Mid: Wireframes (days)","High: Polished (weeks)"]}],practice:{title:"Plan",prompt:"'Group ordering' feature. Plan fidelity progression.",hints:["Core interaction","What could fail","Speed vs realism"]},quiz:[{q:"Why low fidelity first?",options:["Prettier","Cheaper to change","Users prefer","Required"],correct:1},{q:"'Fail fast' means?",options:["Give up","Test and learn quickly","Write bugs","Skip testing"],correct:1},{q:"High fidelity risk?",options:["Too cheap","Attachment blocks change","Can't understand","Too fast"],correct:1},{q:"Prototyping helps?",options:["Avoid testing","Think and communicate","Skip Define","Replace engineering"],correct:1}]}},{id:"proto_paper",title:"Paper",icon:"📄",duration:"25m",xp:175,content:{intro:"Fast prototypes with paper.",sections:[{title:"Power",text:"Created in minutes, modified instantly, no technical skills."},{title:"Testing",text:"One person 'plays computer' swapping screens."}],practice:{title:"Exercise",prompt:"Bill-splitting app. 4 screens: home, add bill, split, summary.",hints:["5 min per screen","Show tap targets","Include 'back'"]},quiz:[{q:"Key advantage?",options:["Colorful","Minutes to create","Users take home","Permanent"],correct:1},{q:"Who plays 'computer'?",options:["User","Team member","Actual computer","No one"],correct:1},{q:"Include beyond happy path?",options:["Only happy path","Error states","Marketing","Legal"],correct:1},{q:"Why sticky notes?",options:["Pretty","Reusable elements","Required","Decoration"],correct:1}]}},{id:"proto_digital",title:"Digital",icon:"💻",duration:"30m",xp:200,c let selectedAvatar=null;
const state={player:{name:'',emoji:'',xp:0,level:1},progress:{},currentModule:null,currentSubmodule:null,quizState:{current:0,score:0,mode:'quiz'},scenarioState:null};

Object.keys(courseData).forEach(m=>{state.progress[m]={completed:false,submodules:{}};courseData[m].submodules.forEach(s=>{state.progress[m].submodules[s.id]={started:false,lessonDone:false,quizDone:false,quizScore:0}})});

document.querySelectorAll('.avatar-card').forEach(c=>{c.onclick=function(){document.querySelectorAll('.avatar-card').forEach(x=>x.classList.remove('selected'));this.classList.add('selected');selectedAvatar=JSON.parse(this.dataset.avatar);document.getElementById('startBtn').classList.add('active')}});

window.startGame=function(){if(!selectedAvatar)return;state.player={...selectedAvatar,xp:0,level:1};document.getElementById('avatarScreen').style.display='none';document.getElementById('loadingScreen').style.display='flex';setTimeout(()=>{document.getElementById('loadingScreen').style.display='none';document.getElementById('gameHUD').style.display='block';document.getElementById('playerEmoji').textContent=state.player.emoji;document.getElementById('playerName').textContent=state.player.name;document.getElementById('playerRole').textContent=state.player.title;initGame();showAchievement('Welcome!','Begin your Design Thinking journey')},2000)};

function initGame(){renderModuleList();init3D()}

function renderModuleList(){const list=document.getElementById('moduleList');list.innerHTML='';Object.keys(courseData).forEach(k=>{const m=courseData[k],p=state.progress[k],done=Object.values(p.submodules).filter(s=>s.quizDone).length,total=m.submodules.length,pct=Math.round(done/total*100);const div=document.createElement('div');div.className='module-item'+(p.completed?' completed':'');div.innerHTML=`<div class="module-title">${m.icon} ${m.title}</div><div class="module-progress"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${m.color}"></div></div><span>${done}/${total}</span></div>`;div.onclick=()=>openModule(k);list.appendChild(div)})}

function openModule(k){state.currentModule=k;renderSubmodules()}

function renderSubmodules(){const m=courseData[state.currentModule],p=state.progress[state.currentModule];let h=`<div class="tutorial-header"><div class="tutorial-title">${m.icon} ${m.title}</div><button class="close-btn" onclick="closeTutorial()">✕</button></div><div class="breadcrumb"><span onclick="closeTutorial()">🏠</span> → <span class="current">${m.title}</span></div><p style="color:#aaa;margin-bottom:15px;font-size:12px;">${m.description}</p><div class="submodule-grid">`;m.submodules.forEach((s,i)=>{const sp=p.submodules[s.id],prev=i===0||p.submodules[m.submodules[i-1].id].quizDone,locked=!prev,status=sp.quizDone?'done':(sp.started?'progress':'new');h+=`<div class="submodule-card ${locked?'locked':''} ${sp.quizDone?'completed':''}" onclick="${locked?'':`openSubmodule('${s.id}')`}"><span class="status-badge ${status}">${status==='done'?'✓':(status==='progress'?'...':'NEW')}</span><div class="submodule-icon">${s.icon}</div><div class="submodule-title">${s.title}</div><div class="submodule-desc">${s.content.intro.substring(0,60)}...</div><div class="submodule-meta"><span>⏱️${s.duration}</span><span>⭐${s.xp}XP</span></div>${locked?'<div style="font-size:9px;color:#ff8888;margin-top:6px;">🔒 Complete previous</div>':''}</div>`});h+=`</div>`;const allDone=m.submodules.every(s=>p.submodules[s.id].quizDone);h+=`<div class="simulation-container" style="opacity:${allDone?1:0.5}"><div class="sim-header"><div class="sim-title">🎮 Final Simulation</div></div>${allDone?`<button class="btn btn-primary" onclick="startSimulation()">Start Simulation</button>`:`<p style="color:#ff8888;font-size:11px;">Complete all lessons to unlock</p>`}</div>`;document.getElementById('tutorialContainer').innerHTML=h;document.getElementById('tutorialOverlay').style.display='block'}

window.openSubmodule=function(id){state.currentSubmodule=id;state.progress[state.currentModule].submodules[id].started=true;renderLesson()};

function renderLesson(){const m=courseData[state.currentModule],s=m.submodules.find(x=>x.id===state.currentSubmodule),c=s.content;let h=`<div class="tutorial-header"><div class="tutorial-title">${s.icon} ${s.title}</div><button class="close-btn" onclick="backToSubmodules()">✕</button></div><div class="breadcrumb"><span onclick="closeTutorial()">🏠</span> → <span onclick="backToSubmodules()">${m.title}</span> → <span class="current">${s.title}</span></div><div class="lesson-content"><div class="info-box"><strong>📚</strong> ${c.intro}</div>`;c.sections.forEach(sec=>{h+=`<div class="lesson-section"><h3>📖 ${sec.title}</h3>`;if(sec.text)h+=`<p>${sec.text}</p>`;if(sec.list){h+='<ul>';sec.list.forEach(i=>h+=`<li>${i}</li>`);h+='</ul>'}if(sec.tips){h+='<div class="tip-box"><strong>💡</strong><ul>';sec.tips.forEach(t=>h+=`<li>${t}</li>`);h+='</ul></div>'}h+='</div>'});if(c.practice)h+=`<div class="practice-area"><div class="practice-title">✏️ ${c.practice.title}</div><div style="background:rgba(0,0,0,0.3);border-radius:6px;padding:10px;margin-bottom:10px;font-size:12px;">${c.practice.prompt}</div><textarea class="practice-input" placeholder="Your response..."></textarea><div class="tip-box"><strong>Hints:</strong> ${c.practice.hints.join(' • ')}</div></div>`;h+=`</div><div class="btn-group"><button class="btn btn-primary" onclick="startQuiz()">📝 Take Quiz</button><button class="btn btn-secondary" onclick="backToSubmodules()">Back</button></div>`;document.getElementById('tutorialContainer').innerHTML=h;state.progress[state.currentModule].submodules[state.currentSubmodule].lessonDone=true}

window.startQuiz=function(){state.quizState={current:0,score:0,mode:'quiz'};state.scenarioState=null;renderQuiz()};

function renderQuiz(){const m=courseData[state.currentModule],s=m.submodules.find(x=>x.id===state.currentSubmodule),quiz=s.content.quiz;if(state.quizState.current>=quiz.length){renderScenario();return}const q=quiz[state.quizState.current];let h=`<div class="tutorial-header"><div class="tutorial-title">📝 Quiz: ${s.title}</div><button class="close-btn" onclick="backToSubmodules()">✕</button></div><div class="timeline-bar">`;for(let i=0;i<quiz.length;i++){h+=`<div class="timeline-node ${i<state.quizState.current?'completed':(i===state.quizState.current?'active':'')}">${i+1}</div>`;if(i<quiz.length-1)h+=`<div class="timeline-connector ${i<state.quizState.current?'completed':''}"></div>`}h+=`</div><div class="quiz-container"><div class="question-card"><div class="question-text">${q.q}</div><div class="options">`;q.options.forEach((o,i)=>{h+=`<div class="option" onclick="selectAnswer(${i})" id="opt${i}"><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${o}</span></div>`});h+=`</div></div><div class="btn-group"><button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>Submit</button></div></div>`;document.getElementById('tutorialContainer').innerHTML=h}

let selectedAnswer=-1;
window.selectAnswer=function(i){selectedAnswer=i;document.querySelectorAll('.option').forEach((o,x)=>o.classList.toggle('selected',x===i));document.getElementById('submitBtn').disabled=false};

window.submitAnswer=function(){const m=courseData[state.currentModule],s=m.submodules.find(x=>x.id===state.currentSubmodule),q=s.content.quiz[state.quizState.current],correct=selectedAnswer===q.correct;if(correct)state.quizState.score++;document.querySelectorAll('.option').forEach((o,i)=>{if(i===q.correct)o.classList.add('correct');else if(i===selectedAnswer&&!correct)o.classList.add('incorrect');o.style.pointerEvents='none'});setTimeout(()=>{state.quizState.current++;selectedAnswer=-1;renderQuiz()},1000)};

function renderScenario(){const scenarios=branchingScenarios[state.currentModule];if(!scenarios||scenarios.length===0){showResults();return}const sc=scenarios[Math.floor(Math.random()*scenarios.length)];state.scenarioState={metrics:{...sc.context},choice:null,decision:null};let h=`<div class="tutorial-header"><div class="tutorial-title">🎭 Scenario Challenge</div><button class="close-btn" onclick="backToSubmodules()">✕</button></div><div class="scenario-container"><div class="scenario-header"><div class="scenario-avatar">${sc.character}</div><div class="scenario-info"><h4>${sc.title}</h4><p>${sc.role}</p></div></div><div class="scenario-narrative">${sc.situation}</div><div class="scenario-context">`;Object.entries(sc.context).forEach(([k,v])=>{const icons={teamMorale:'😊',patientSafety:'🏥',stakeholderTrust:'🤝',timeline:'⏰',culturalFit:'🌍',marketSuccess:'📈',budget:'💰',localTrust:'🤲',clarity:'🎯',alignment:'🧭',momentum:'🚀',politicalCapital:'🏛️',productVision:'🔮',boardConf:'📊',teamFocus:'👁️',userAlignment:'👥',ideaCount:'💡',novelty:'✨',teamEnergy:'⚡',feasibility:'🔧',teamUnity:'🤜',ideaDiversity:'🌈',culturalIntegration:'🔗',innovation:'💡',investorConf:'💼',credibility:'📜',fundingProb:'💵',teamIntegrity:'🛡️',workerAdoption:'👷',functionality:'⚙️',safety:'🦺',decisionClarity:'🎯',stakeholderConf:'📊',designCredibility:'🎨',businessImpact:'💹',customerRet:'🔄',teamHealth:'❤️',brandRep:'🏆',recovery:'📈'};h+=`<div class="context-card"><div class="context-icon">${icons[k]||'📊'}</div><div class="context-label">${k.replace(/([A-Z])/g,' $1')}</div><div class="context-value">${v}%</div></div>`});h+=`</div><div class="decision-prompt"><h5>⚡ Critical Decision</h5><p>How do you respond?</p></div><div class="scenario-choices">`;sc.decisions.forEach(d=>{h+=`<div class="scenario-choice" onclick="selectScenario('${d.id}')" id="sc-${d.id}"><span class="choice-letter">${d.id}</span><div class="choice-content"><div class="choice-title">${d.title}</div><div class="choice-desc">${d.desc}</div><div class="choice-impact">${Object.entries(d.impacts).map(([k,v])=>`<span class="${v>=0?'impact-positive':'impact-negative'}">${k.replace(/([A-Z])/g,' $1')}: ${v>=0?'+':''}${v}</span>`).join(' | ')}</div></div></div>`});h+=`</div><div class="btn-group"><button class="btn btn-primary" id="confirmBtn" onclick="confirmScenario()" disabled>Confirm Decision</button></div><div id="scenarioResult"></div></div>`;document.getElementById('tutorialContainer').innerHTML=h;window.currentScenario=sc}

window.selectScenario=function(id){state.scenarioState.choice=id;document.querySelectorAll('.scenario-choice').forEach(c=>c.classList.toggle('selected',c.id==='sc-'+id));document.getElementById('confirmBtn').disabled=false};

window.confirmScenario=function(){const sc=window.currentScenario,d=sc.decisions.find(x=>x.id===state.scenarioState.choice);Object.entries(d.impacts).forEach(([k,v])=>{if(state.scenarioState.metrics[k]!==undefined)state.scenarioState.metrics[k]=Math.max(0,Math.min(100,state.scenarioState.metrics[k]+v))});state.scenarioState.decision=d;const avg=Math.round(Object.values(state.scenarioState.metrics).reduce((a,b)=>a+b,0)/Object.keys(state.scenarioState.metrics).length);const cls=d.outcome==='positive'?'':(d.outcome==='poor'?'poor':'fail');document.getElementById('scenarioResult').innerHTML=`<div class="scenario-result ${cls}"><div class="result-icon">${d.outcome==='positive'?'🎉':(d.outcome==='poor'?'⚠️':'❌')}</div><div class="result-title">${d.outcome==='positive'?'Excellent!':(d.outcome==='poor'?'Suboptimal':'Critical Misstep')}</div><div class="result-feedback">${d.feedback}</div><div class="result-metrics">${Object.entries(state.scenarioState.metrics).map(([k,v])=>{const chg=d.impacts[k]||0;return`<div class="metric"><div class="metric-value" style="color:${v>=70?'#00ff88':(v>=40?'#ffaa00':'#ff5555')}">${v}%</div><div class="metric-label">${k.replace(/([A-Z])/g,' $1')}</div>${chg?`<div class="metric-change ${chg>0?'up':'down'}">${chg>0?'↑':'↓'}${Math.abs(chg)}</div>`:''}</div>`}).join('')}</div><div style="font-family:'Orbitron',monospace;font-size:28px;color:#fff;margin:15px 0;">${avg}%</div><div class="btn-group"><button class="btn btn-success" onclick="showResults()">Complete Assessment</button></div></div>`;document.querySelectorAll('.scenario-choice').forEach(c=>c.style.pointerEvents='none');document.getElementById('confirmBtn').style.display='none'};

function showResults(){const m=courseData[state.currentModule],s=m.submodules.find(x=>x.id===state.currentSubmodule),quiz=s.content.quiz,qPct=Math.round(state.quizState.score/quiz.length*100),sPct=state.scenarioState?Math.round(Object.values(state.scenarioState.metrics).reduce((a,b)=>a+b,0)/Object.keys(state.scenarioState.metrics).length):70,total=Math.round((qPct+sPct)/2),passed=total>=60;if(passed){state.progress[state.currentModule].submodules[state.currentSubmodule].quizDone=true;state.progress[state.currentModule].submodules[state.currentSubmodule].quizScore=total;addXP(s.xp);showAchievement('Complete!',`${s.title}: ${total}%`)}document.getElementById('tutorialContainer').innerHTML=`<div class="tutorial-header"><div class="tutorial-title">🏆 Results</div><button class="close-btn" onclick="backToSubmodules()">✕</button></div><div class="results-card" style="${passed?'':'border-color:#ff5555'}"><h2>${passed?'🎉 Passed!':'📚 Keep Practicing'}</h2><div class="results-score">${total}%</div><div class="results-details"><div class="result-stat"><div class="result-stat-value">${state.quizState.score}/${quiz.length}</div><div class="result-stat-label">Quiz</div></div><div class="result-stat"><div class="result-stat-value">${sPct}%</div><div class="result-stat-label">Scenario</div></div><div class="result-stat"><div class="result-stat-value">${passed?s.xp:0}</div><div class="result-stat-label">XP</div></div></div><div class="btn-group">${passed?`<button class="btn btn-success" onclick="backToSubmodules()">Continue</button>`:`<button class="btn btn-primary" onclick="renderLesson()">Review</button><button class="btn btn-secondary" onclick="startQuiz()">Retry</button>`}</div></div>`}

window.startSimulation=function(){const m=courseData[state.currentModule],sim=m.simulation;let h=`<div class="tutorial-header"><div class="tutorial-title">🎮 ${sim.title}</div><button class="close-btn" onclick="backToSubmodules()">✕</button></div><div class="simulation-container"><div class="sim-header"><div class="sim-title">${m.icon} Final Simulation</div></div><div style="background:rgba(0,0,0,0.3);border-radius:8px;padding:15px;margin-bottom:15px;font-size:12px;"><strong>📋 Scenario:</strong> ${sim.scenario}</div><h4 style="color:#00ffff;margin-bottom:12px;">📝 Tasks</h4>`;sim.tasks.forEach((t,i)=>{h+=`<div class="sim-task"><strong>Task ${i+1}: ${t.title}</strong> (${t.points}pts)<p style="color:#aaa;font-size:11px;margin:6px 0;">${t.desc}</p><textarea class="practice-input" id="simTask${i}" placeholder="Your response..." style="min-height:80px;"></textarea></div>`});h+=`<div class="btn-group"><button class="btn btn-success" onclick="submitSimulation()">Submit</button><button class="btn btn-secondary" onclick="backToSubmodules()">Cancel</button></div></div>`;document.getElementById('tutorialContainer').innerHTML=h};

window.submitSimulation=function(){const m=courseData[state.currentModule],sim=m.simulation;let total=0;sim.tasks.forEach((t,i)=>{const r=document.getElementById('simTask'+i).value.trim(),words=r.split(/\s+/).filter(w=>w).length;let score=0;if(words>=80)score=t.points;else if(words>=40)score=Math.round(t.points*0.8);else if(words>=20)score=Math.round(t.points*0.6);else if(words>=5)score=Math.round(t.points*0.3);total+=score});const passed=total>=sim.passingScore;if(passed){state.progress[state.currentModule].completed=true;addXP(300);showAchievement('Module Complete!',m.title+' Mastered!')}document.getElementById('tutorialContainer').innerHTML=`<div class="tutorial-header"><div class="tutorial-title">🏆 Simulation Results</div><button class="close-btn" onclick="backToSubmodules()">✕</button></div><div class="results-card" style="${passed?'border-color:#ffd700':'border-color:#ff5555'}"><h2>${passed?'🎉 Simulation Passed!':'📚 Not Quite'}</h2><div class="results-score">${total}%</div><p style="color:#aaa;margin-bottom:15px;">Passing: ${sim.passingScore}%</p>${passed?`<div style="background:linear-gradient(135deg,#1a1a2e,#0a0a1a);border:2px solid #ffd700;border-radius:15px;padding:25px;margin:15px 0;"><div style="font-size:40px;margin-bottom:10px;">🏅</div><div style="font-family:'Orbitron',monospace;font-size:20px;color:#ffd700;">Certificate</div><div style="margin:15px 0;color:#ddd;">${state.player.name} completed<br><strong style="color:#00ffff;">${m.title}</strong></div></div>`:''}<div class="btn-group">${passed?`<button class="btn btn-success" onclick="closeTutorial()">Return</button>`:`<button class="btn btn-primary" onclick="startSimulation()">Retry</button><button class="btn btn-secondary" onclick="backToSubmodules()">Review</button>`}</div></div>`;renderModuleList()};

window.backToSubmodules=function(){renderSubmodules()};
window.closeTutorial=function(){document.getElementById('tutorialOverlay').style.display='none';state.currentModule=null;state.currentSubmodule=null;renderModuleList()};

function addXP(amt){state.player.xp+=amt;const lvl=Math.floor(state.player.xp/1000)+1;if(lvl>state.player.level){state.player.level=lvl;showAchievement('Level Up!','Level '+lvl)}document.getElementById('xpFill').style.width=(state.player.xp%1000)/10+'%';document.getElementById('xpDisplay').textContent=state.player.xp%1000;document.getElementById('levelDisplay').textContent=state.player.level}

function showAchievement(t,d){document.getElementById('achieveTitle').textContent='🏆 '+t;document.getElementById('achieveDesc').textContent=d;document.getElementById('achievement').classList.add('show');setTimeout(()=>document.getElementById('achievement').classList.remove('show'),3000)}

let scene,camera,renderer;
const player={pos:{x:0,y:2,z:40},rot:{x:0,y:0},vel:{x:0,y:0,z:0},speed:0.2,canJump:true,isLocked:false};
const keys={};
const modules3D=[];
const moduleInfo=[{key:'empathy',name:'Empathy',icon:'❤️',x:-25,z:-25,color:0x00ff88},{key:'define',name:'Define',icon:'🎯',x:25,z:-25,color:0x0088ff},{key:'ideate',name:'Ideate',icon:'💡',x:-25,z:25,color:0xffff00},{key:'prototype',name:'Prototype',icon:'🔧',x:25,z:25,color:0xff8800},{key:'test',name:'Test',icon:'🧪',x:0,z:0,color:0xff00ff}];

function init3D(){scene=new THREE.Scene();scene.background=new THREE.Color(0x000022);scene.fog=new THREE.Fog(0x000022,10,120);camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(player.pos.x,player.pos.y,player.pos.z);renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gameCanvas'),antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);const floor=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x111133,metalness:0.8,roughness:0.3}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new THREE.GridHelper(150,60,0x00ffff,0x002244);grid.material.opacity=0.4;grid.material.transparent=true;scene.add(grid);scene.add(new THREE.AmbientLight(0x404080,0.6));const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(10,30,10);scene.add(light);moduleInfo.forEach(m=>{const g=new THREE.Group();g.userData={type:'module',key:m.key};const platform=new THREE.Mesh(new THREE.CylinderGeometry(8,8,1,32),new THREE.MeshStandardMaterial({color:0x1a1a3e,emissive:m.color,emissiveIntensity:0.1}));platform.position.y=0.5;g.add(platform);const ring=new THREE.Mesh(new THREE.TorusGeometry(9,0.25,8,64),new THREE.MeshBasicMaterial({color:m.color,transparent:true,opacity:0.7}));ring.rotation.x=Math.PI/2;ring.position.y=1;g.add(ring);const pillar=new THREE.Mesh(new THREE.CylinderGeometry(1.5,2.5,2.5,8),new THREE.MeshStandardMaterial({color:0x003366,metalness:0.9,emissive:m.color,emissiveIntensity:0.3}));pillar.position.y=2;pillar.userData={clickable:true,key:m.key};g.add(pillar);const orb=new THREE.Mesh(new THREE.SphereGeometry(0.6,16,16),new THREE.MeshBasicMaterial({color:m.color,transparent:true,opacity:0.8}));orb.position.y=8;orb.userData={float:true,baseY:8};g.add(orb);g.position.set(m.x,0,m.z);scene.add(g);modules3D.push(g)});const particles=new THREE.BufferGeometry();const pPos=[];for(let i=0;i<300;i++)pPos.push((Math.random()-0.5)*120,Math.random()*20,(Math.random()-0.5)*120);particles.setAttribute('position',new THREE.Float32BufferAttribute(pPos,3));scene.add(new THREE.Points(particles,new THREE.PointsMaterial({color:0x88ccff,size:0.12,transparent:true,opacity:0.6})));setupControls();animate()}

function setupControls(){const canvas=document.getElementById('gameCanvas');document.getElementById('enableMouseBtn').onclick=e=>{e.stopPropagation();canvas.requestPointerLock?.();document.getElementById('moveHint').style.display='none'};document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();keys[k]=true;if(k==='arrowup')keys.w=true;if(k==='arrowdown')keys.s=true;if(k==='arrowleft')keys.a=true;if(k==='arrowright')keys.d=true;if(k===' '&&player.canJump){player.vel.y=0.3;player.canJump=false}if(k==='e')checkInteraction();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault()});document.addEventListener('keyup',e=>{if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();keys[k]=false;if(k==='arrowup')keys.w=false;if(k==='arrowdown')keys.s=false;if(k==='arrowleft')keys.a=false;if(k==='arrowright')keys.d=false});document.addEventListener('mousemove',e=>{if(player.isLocked){player.rot.y-=e.movementX*0.002;player.rot.x-=e.movementY*0.002;player.rot.x=Math.max(-1.2,Math.min(1.2,player.rot.x))}});canvas.onclick=()=>{if(document.getElementById('tutorialOverlay').style.display==='block')return;if(!player.isLocked){canvas.requestPointerLock?.();document.getElementById('moveHint').style.display='none'}};document.addEventListener('pointerlockchange',()=>{player.isLocked=document.pointerLockElement===canvas;document.getElementById('crosshair').style.display=player.isLocked?'block':'none'});window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)})}

function checkInteraction(){const p=new THREE.Vector3(camera.position.x,0,camera.position.z);modules3D.forEach(m=>{if(p.distanceTo(new THREE.Vector3(m.position.x,0,m.position.z))<12&&m.userData.key)openModule(m.userData.key)})}

function updatePlayer(){const speed=player.speed;const move=new THREE.Vector3();if(keys.w)move.z-=speed;if(keys.s)move.z+=speed;if(keys.a)move.x-=speed;if(keys.d)move.x+=speed;move.applyAxisAngle(new THREE.Vector3(0,1,0),player.rot.y);player.pos.x+=move.x;player.pos.z+=move.z;player.vel.y-=0.01;player.pos.y+=player.vel.y;if(player.pos.y<=2){player.pos.y=2;player.vel.y=0;player.canJump=true}player.pos.x=Math.max(-70,Math.min(70,player.pos.x));player.pos.z=Math.max(-70,Math.min(70,player.pos.z));camera.position.set(player.pos.x,player.pos.y,player.pos.z);camera.rotation.order='YXZ';camera.rotation.y=player.rot.y;camera.rotation.x=player.rot.x;let near=false;const p2d=new THREE.Vector3(player.pos.x,0,player.pos.z);modules3D.forEach(m=>{if(p2d.distanceTo(new THREE.Vector3(m.position.x,0,m.position.z))<12)near=true});document.getElementById('interactPrompt').style.display=near?'block':'none'}

function animate(){requestAnimationFrame(animate);updatePlayer();const t=Date.now()*0.001;scene.traverse(o=>{if(o.userData?.float)o.position.y=o.userData.baseY+Math.sin(t*2)*0.4});renderer.render(scene,camera)}
</script>
